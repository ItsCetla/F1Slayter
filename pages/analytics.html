<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting… — Slayter League</title>
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=../analytics/?season=season-1" />
    <link rel="canonical" href="../analytics/" />
    <script>
      // Old URL from the previous site; forward to its new home.
      (function () {
        // The old analytics page showed the 2025 season, so default to Season 1.
        var target = "../analytics/";
        var search = location.search || "?season=season-1";
        var hash = location.hash;
        location.replace(target + search + hash);
      })();
    </script>
  </head>
  <body>
    <p>This page has moved to <a href="../analytics/">../analytics/</a>.</p>
  </body>
</html>

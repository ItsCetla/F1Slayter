<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting… — Slayter League</title>
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=../results/" />
    <link rel="canonical" href="../results/" />
    <script>
      // Old URL from the previous site; forward to its new home.
      (function () {
        var target = "../results/";
        // Old deep links used the race name as the hash, e.g. sessions.html#Austria (Season 1).
        var rounds = { "abu dhabi": 1, "las vegas": 2, "bahrain": 3, "saudi arabia": 4, "azerbaijan": 5, "miami": 6, "japan": 7, "austria": 8 };
        var name = decodeURIComponent(location.hash.slice(1)).toLowerCase();
        if (rounds[name]) { location.replace(target + "?season=season-1&round=" + rounds[name]); return; }
        location.replace(target + location.search + location.hash);
      })();
    </script>
  </head>
  <body>
    <p>This page has moved to <a href="../results/">../results/</a>.</p>
  </body>
</html>
